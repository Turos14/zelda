name: MakeCode Build
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      # -j : compile pour le simulateur (le jeu est trop gros pour la console n3 par défaut)
      - run: npx makecode build -j
